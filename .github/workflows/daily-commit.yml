name: Daily Auto Commit

on:
  schedule:
    - cron: '15 2 * * *'   # specific time (UTC)
  workflow_dispatch:

jobs:
  commit-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: 22f2000850@ds.study.iitm.ac.in - Update timestamp
        run: |
          echo "Last updated on $(date -u)" >> daily-log.txt

      - name: Commit changes
        run: |
          git config user.name "DevSync Bot"
          git config user.email "22f2000850@ds.study.iitm.ac.in"
          git add daily-log.txt
          git commit -m "Automated daily commit - $(date -u)" || echo "No changes to commit"
          git push
