name: Daily Cron Commit

on:
  schedule:
    - cron: '10 3 * * *'   # Runs daily at 03:10 UTC (specific time)
  workflow_dispatch:

jobs:
  commit-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: 22f2000850@ds.study.iitm.ac.in
        run: echo "Running daily update"

      - name: Create commit
        run: |
          echo "Updated on $(date -u)" >> daily-log.txt
          git config user.name "DevSync Bot"
          git config user.email "22f2000850@ds.study.iitm.ac.in"
          git add daily-log.txt
          git commit -m "Daily automated commit $(date -u)" || echo "No changes"
          git push
